name: Project Build Check

# 1. When should this run? (On every push to the 'main' branch)
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 2. Download the code from your repository
    - name: Checkout Code
      uses: actions/checkout@v3

    # 3. Try to build the Docker containers
    - name: Build Docker Images
      run: docker compose build

    # 4. Success message
    - name: Status Check
      run: echo "Build successful! Your containers are production-ready."