name: CI/CD Docker Build Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. UPDATED TO v4: This fixes the 'Node.js 20/24' and 'Exit code 128' errors
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Build the Docker containers
    - name: Build Docker Images
      run: docker compose build

    - name: Final Status
      run: echo "Build successful! Your MERN stack is production-ready."